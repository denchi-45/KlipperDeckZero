[application]
dark_mode=no

[moonraker]
# unix: Moonraker unix socket (on the CardputerZero itself)
# websocket: ws://<host>:7125/websocket (desktop simulator / remote printer)
# Default: unix on the device, websocket in the desktop simulator.
#transport=websocket
socket_path=~/printer_data/comms/moonraker.sock
url=ws://127.0.0.1:7125/websocket
# Only needed when the client is not in Moonraker's [authorization] trusted_clients.
#api_key=
