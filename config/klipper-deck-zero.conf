[application]
dark_mode=no

[moonraker]
# unix: Klipper/Moonraker on this device, through socket_path
# websocket: Klipper/Moonraker on another host, through ws://<host>:<port>/websocket
# Default: unix on the device, websocket to 127.0.0.1 in the desktop simulator.
#transport=websocket
socket_path=~/printer_data/comms/moonraker.sock
# IP address or host name of the printer (e.g. 192.168.1.50, mainsailos.local)
host=127.0.0.1
port=7125
# Only needed when the client is not in Moonraker's [authorization] trusted_clients.
#api_key=
